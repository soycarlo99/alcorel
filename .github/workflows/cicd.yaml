name: CI/CD pipeline
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
env:
  ASPNETCORE_ENVIRONMENT: CI
  EMAIL__PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
  PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
  PG_DATABASE: ${{ secrets.PG_DATABASE }}
  PG_PORT: ${{ secrets.PG_PORT }}
  PG_HOST: ${{ secrets.PG_HOST }}
  PG_USER: ${{ secrets.PG_USER }}
jobs:
  # Name of the job/test
  api_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install Newman
        run: npm install -g newman
      - name: Install dotnet project dependencies
        run: cd server/server && dotnet restore
      - name: Build
        run: cd server/server && dotnet build
      - name: Start Server
        run: cd server/server && nohup dotnet run &
      - name: Run API-Tests
        run: cd server/server && newman run ./AlcoRel.postman_collection.json --verbose
  gui_tests:
    runs-on: ubuntu-latest
    needs: api_tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install dotnet project dependencies
        run: cd server/server && dotnet restore
      - name: Build/Restore Playwright Project
        run: cd server/alcorel-gui.Tests && dotnet build
      - name: Ensure browsers are installed
        run: cd server/alcorel-gui.Tests && pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps
      - name: Start server
        run: cd server/server && nohup dotnet run &
      - name: Run GUI-tests
        run: cd server/alcorel-gui.Tests && dotnet test
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    # needs: [api_tests, gui_tests]
    steps:
      - name: Deploy App
        uses: appleboy/ssh-action@v1.2.0
        env:
          ASPNETCORE_ENVIRONMENT: CI
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL__PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          PG_PASSWORD: ${{ secrets.PG_PASSWORD }}
          PG_DATABASE: ${{ secrets.PG_DATABASE }}
          PG_PORT: ${{ secrets.PG_PORT }}
          PG_HOST: ${{ secrets.PG_HOST }}
          PG_USER: ${{ secrets.PG_USER }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          script: |
            source /root/.nvm/nvm.sh
            source ~/.bashrc
            nvm use v22
            npm install -g pm2
            cd /srv/www/alcorel
            git pull
            npm ci
            npm run build
            cd server/server/
            dotnet restore
            dotnet build
            pm2 stop alcorel || true
            pm2 delete alcorel || true

            # ASPNETCORE_ENVIRONMENT=Production \
            Email__Password="${{ secrets.EMAIL_PASSWORD }}" \
            PG_PASSWORD="${{ secrets.PG_PASSWORD }}" \
            PG_DATABASE="${{ secrets.PG_DATABASE }}" \
            PG_PORT="${{ secrets.PG_PORT }}" \
            PG_HOST="${{ secrets.PG_HOST }}" \
            PG_USER="${{ secrets.PG_USER }}"
            pm2 start "dotnet run" --name alcorel
